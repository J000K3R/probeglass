# ProbeGlass — the quickest way to run it.
#
#   docker compose up -d
#   open http://localhost:8080
#
# The first visit asks you to choose the dashboard password. Nothing else is
# required: sensors are configured in the web UI.

services:
  probeglass:
    image: ghcr.io/j000k3r/probeglass:dev
    # To build from a checkout instead of pulling, replace the line above with:
    # build: .
    container_name: probeglass
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - probeglass-data:/data
      # Docker container sensors need the host's Docker socket, and this is the
      # one line in this file that hands out more than it looks like. Whoever can
      # reach that socket can start a container that mounts the whole host as
      # root — it is not "just monitoring", it is the keys to the machine. Read
      # SECURITY.md before you uncomment it, and leave it commented if you do not
      # watch Docker containers.
      #
      # - /var/run/docker.sock:/var/run/docker.sock:ro
      #
      # The :ro is a reminder rather than a protection: a read-only mount does not
      # stop anyone from writing to the socket itself. The prober only ever issues
      # GET requests, and that is a promise about this program, not a wall around
      # what the socket can do.
    environment:
      # The user the daemon ends up as. It starts as root, gives /data to
      # PUID:PGID and becomes that user before it opens anything. 500:500 is the
      # default and matches the identity every other image on the platforms this
      # ships to runs as; change it when /data is a host folder that somebody else
      # owns. PUID=0 keeps root, which is not recommended.
      PUID: 500
      PGID: 500
      # Quote the mask. YAML turns an unquoted 022 into the number 18, and the
      # daemon refuses to start on a mask that is not one.
      UMASK: "022"
      # Used to build the links that alert messages point back to. Set this to
      # the address you actually reach the dashboard on.
      PROBEGLASS_BASE_URL: http://localhost:8080
      PROBEGLASS_LOG_LEVEL: info
      # Set a password here to skip the setup screen on a fresh database. It is
      # ignored once a password has been stored.
      # PROBEGLASS_ADMIN_PASSWORD: change-me
    # ICMP ping needs a raw socket. Without this the ping sensors report exactly
    # that, and every other sensor type keeps working.
    cap_add:
      - NET_RAW
    # The image is distroless and starts as root only so that it can take /data
    # over and leave root again; these lines matter if you harden further.
    # no-new-privileges forbids *gaining* privileges, not giving them away, so it
    # does not stand in the way of that drop.
    security_opt:
      - no-new-privileges:true
    # Setting a user here overrides all of the above: the runtime picks the uid
    # before the process starts, so PUID, PGID and UMASK are ignored, and a daemon
    # that is not root cannot claim /data for itself either. Use it only to run as
    # whoever already owns the host folder — see
    # https://j000k3r.github.io/probeglass-docs/operations/troubleshooting
    # user: "1000:1000"
    healthcheck:
      test: ["CMD", "/usr/local/bin/probeglass", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  probeglass-data:
