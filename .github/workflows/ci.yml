name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # A go.mod that is not tidy breaks everyone else's build, so it is a
      # failure here rather than a surprise later. The e2e module is checked
      # too: `go test ./...` in the root skips a nested module silently, so
      # nothing else would ever notice that its go.sum had gone stale.
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          (cd e2e && go mod tidy)
          git diff --exit-code -- go.mod go.sum e2e/go.mod e2e/go.sum

      - name: Sensor formatting
        run: |
          unformatted=$(gofmt -l . | tee /dev/stderr)
          test -z "$unformatted"

      - name: Vet
        run: go vet ./...

      # The scheduler runs one goroutine per sensor and the API serves SSE from
      # another; a race here would corrupt sensor state silently.
      #
      # The timeout is raised because `internal/api` alone takes six to seven
      # minutes under the race detector here, and the runner is slower than the
      # machine that was measured on. Go's default of ten minutes per package
      # was reached on 2026-10-19: the step failed after 10m50s with no test
      # named, which is the default timeout, not an assertion.
      #
      # The log goes to a file so that a failure can say which package or test
      # it was in a workflow annotation. The job log needs admin rights on this
      # repository, and an annotation is readable through the public API — which
      # is the only way this machine gets to see why the job went red.
      - name: Test with the race detector
        run: |
          go test ./... -count=1 -race -timeout=20m \
            -coverprofile=coverage.out -covermode=atomic > "$RUNNER_TEMP/test.log" 2>&1 || {
            grep -E '^(--- FAIL|FAIL|panic:)' "$RUNNER_TEMP/test.log" | while IFS= read -r line; do
              echo "::error title=Go test::$line"
            done
            exit 1
          }

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      # The three architectures the container image is published for. This used
      # to be seven targets, including darwin, windows and freebsd; those are
      # gone from the release, the workflow and the documentation alike. The
      # product is a container, and the archives promised a second way to run it
      # that nothing documented and that two things would not have survived: the
      # docker sensor speaks to the Engine over a unix socket, and `doctor` tells
      # you to run it with `docker exec`.
      #
      # Kept as a step of its own rather than left to the Docker job, because
      # that job builds only amd64 and arm64 — armv7 would otherwise be compiled
      # for the first time by the release, which is the worst moment to find out.
      - name: Build for every architecture the image ships
        run: |
          for target in linux/amd64 linux/arm64 linux/armv7; do
            os=${target%/*}
            arch=${target#*/}
            goarch=${arch%v7}
            goarm=""
            [ "${arch}" = "armv7" ] && goarm="GOARM=7"
            env CGO_ENABLED=0 GOOS="${os}" GOARCH="${goarch}" ${goarm} \
              go build -trimpath -o /dev/null ./cmd/probeglass
            echo "ok ${target}"
          done

  browser:
    name: Browser test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Pinned rather than the runner's preinstalled Chrome, so that a browser
      # update cannot change the result of this job without anyone noticing.
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable

      # This is the only job that renders a page. Everything else here talks to
      # the API, and the API was answering 200 the whole time the dashboard was
      # showing a spinner over a page that had loaded perfectly. A CSS rule that
      # outranks the hidden attribute is invisible to a check that never lays
      # anything out, so it has to be looked at.
      #
      # Once more if it fails, and only then. The suite drives a real browser and
      # several tests wait on animation and layout windows; on a busy runner that
      # produces a failure the same commit does not produce on a laptop or in a
      # Linux container (it was red for seven commits in a row while passing in
      # both). A second run separates the two cases for the price of a minute: a
      # runner that tripped is green the second time, and a change that really
      # broke something fails twice and the job stays red.
      - name: Dashboard renders in a real browser
        env:
          PROBEGLASS_E2E_BROWSER: ${{ steps.chrome.outputs.chrome }}
          # Without this the test would skip when no browser is found, and a
          # skipped test in a green job reads exactly like a passing one.
          PROBEGLASS_E2E_REQUIRE_BROWSER: "1"
          PROBEGLASS_E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
        run: |
          cd e2e
          # The log stays in a file for the same reason as the Test job's: a
          # failing test is reported as a workflow annotation, because the job
          # log itself needs admin rights on this repository.
          log="$RUNNER_TEMP/e2e.log"
          run_suite() {
            go test ./... -count=1 -v -timeout=10m > "$log" 2>&1
          }
          report_failures() {
            grep -E '^(--- FAIL|FAIL|panic:)' "$log" | while IFS= read -r line; do
              echo "::error title=Browser test::$line"
            done
          }
          if run_suite; then
            exit 0
          fi
          report_failures
          echo "::warning title=Browser test::failed once; running the suite again before calling it broken"
          if run_suite; then
            exit 0
          fi
          report_failures
          exit 1

      # Worth more than the stack trace when the failure is "the spinner is
      # still on screen", which is hard to picture and easy to misread.
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, and — the important part — compiled here by the Go that
          # setup-go installed rather than downloaded as a prebuilt binary.
          #
          # `version: latest` used to hand this job golangci-lint v1.64.8, which
          # was built with go1.24 and refuses to read a go.mod that says 1.27.1:
          #
          #     can't load config: the Go language version (go1.24) used to build
          #     golangci-lint is lower than the targeted Go version (1.27.1)
          #
          # so the job failed before it linted a single line. A pinned version
          # cannot drift back to that, and building it from source means the
          # toolchain match is settled here instead of by whoever cut the release.
          install-mode: goinstall
          version: v2.14.0
          args: --timeout=5m

      # The e2e module is nested, so `./...` here does not reach it. It gets its
      # own run rather than being left as the one unlinted corner of the tree.
      - uses: golangci/golangci-lint-action@v9
        with:
          install-mode: goinstall
          version: v2.14.0
          working-directory: e2e
          args: --timeout=5m

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # Built for both architectures but never pushed: this job only proves the
      # Dockerfile works, including the arm64 cross-build that runs on a Pi.
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}

  smoke:
    name: The container takes /data over
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Loaded into the runner's own image store rather than pushed: nothing here is
      # about publishing, it is about what the image does when it starts. That needs a
      # real Linux kernel and a real bind mount — Docker Desktop on a laptop does not pass
      # bind-mount ownership through at all, so this job is the only place the privilege
      # drop is exercised from end to end.
      - name: Build for the runner's architecture
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: probeglass:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}

      # Starts the image on a folder owned by root and checks that it ends up owning it,
      # that the daemon reports the uid it was asked for, that an unprivileged process can
      # still open an ICMP socket, and — the negative control — that the same image started
      # with --user still fails and says why. Without that last check, every other assertion
      # here would pass on a folder that had been 500:500 all along.
      - name: Smoke test the privilege drop
        run: scripts/smoke-privdrop.sh
