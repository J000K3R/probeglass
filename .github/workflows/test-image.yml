name: Test image

# A container image for the people trying this out before it is released, and for
# nobody else.
#
# It goes to the GitHub Container Registry, which is where the released image goes
# too, so there is one registry to reason about and no second set of credentials.
# A package on ghcr.io inherits this repository's own access list: whoever can see
# the repository can pull the image. That is also what makes the repository the only
# thing to manage — there is no second list to keep in step.
#
# The package is public, so pulling it needs no account and no login. Should it ever
# be made private again, that access list is what decides who can still pull.
#
# No secrets are involved: GitHub Actions pushes with the GITHUB_TOKEN it is already
# given, which is why `permissions` below is the whole of the authorisation.
#
# None of this is a release. The tag is `dev`, and the `v*` tags belong to release.yml,
# which is what produces the versioned ones.

on:
  # A button, for handing the testers a build on purpose.
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write   # to push the image

# One image at a time. Two pushes in quick succession would otherwise race to write
# the same `dev` tag, and the loser's image would be the one left standing.
concurrency:
  group: test-image
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  # The image is spelled out in full, and in lower case, rather than built from
  # `github.repository`: that would be "J000K3R/probeglass", and a registry refuses a
  # repository name containing capitals. release.yml derives the same name from
  # IMAGE_NAMESPACE for the same reason.
  IMAGE: ghcr.io/j000k3r/probeglass

jobs:
  image:
    name: Build and push :dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the tags, so the build can name the release it follows

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `github.event.head_commit.timestamp` is empty when this runs from the button,
      # and a version string without a date is a version string nobody can place. The
      # clock is read here instead, which is right on both paths.
      # What `probeglass version` reports, and the same string `make build` produces
      # in a working tree: the release this build follows and how far past it, as in
      # `0.2.1-3-g005ab01`.
      #
      # Derived rather than written down. It used to be the literal `0.1.0-dev`, which
      # was true once and then went on being said by every dev image for two minor
      # versions — so the one build somebody pulls to test the newest work was the one
      # build that could not say which work it was. A version stamp that has to be
      # remembered is a version stamp that will be wrong.
      - name: Work out the version
        id: version
        run: |
          set -euo pipefail
          # No --always, for the reason the Makefile gives: it falls back to a bare
          # commit hash, which is a worse answer than the word dev for a tree that has
          # no tags to describe.
          described=$(git describe --tags 2>/dev/null | sed 's/^v//' || true)
          echo "value=${described:-dev}" >> "$GITHUB_OUTPUT"

      - name: Note the build time
        id: stamp
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Two tags: `dev` for whoever just wants the newest build, and the commit for
      # whoever has to say exactly which one broke.
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=dev
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.stamp.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
