name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # to create the release
  packages: write   # to push to ghcr.io

env:
  GOTOOLCHAIN: local
  IMAGE_NAME: weatherglass
  # The Docker Hub namespace every document in this project names. `make rename`
  # rewrites the Go module path but deliberately leaves the image name alone, so a
  # fork that publishes under its own account has to change this line, `IMAGE` in
  # the Makefile, and the mentions the guard below lists.
  IMAGE_NAMESPACE: j000k3r

jobs:
  goreleaser:
    name: Binaries and release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the changelog is generated from the tag history

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The test suite decides whether the tag becomes a release.
      - name: Test
        run: go test ./... -count=1 -race

      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-s -w \
            -X github.com/j000k3r/weatherglass/internal/model.Version=${VERSION} \
            -X github.com/j000k3r/weatherglass/internal/model.Commit=${COMMIT} \
            -X github.com/j000k3r/weatherglass/internal/model.BuildDate=${BUILD_DATE}"
          for target in linux/amd64 linux/arm64 linux/armv7 darwin/amd64 darwin/arm64 windows/amd64 freebsd/amd64; do
            os=${target%/*}
            arch=${target#*/}
            goarch=${arch%v7}
            goarm=""
            [ "${arch}" = "armv7" ] && goarm="GOARM=7"
            name="weatherglass_${VERSION}_${os}_${arch}"
            out="dist/${name}"
            mkdir -p "${out}"
            env CGO_ENABLED=0 GOOS="${os}" GOARCH="${goarch}" ${goarm} \
              go build -trimpath -ldflags "${ldflags}" -o "${out}/weatherglass" ./cmd/weatherglass
            cp README.md LICENSE "${out}/"
            (cd dist && zip -qr "${name}.zip" "${name}" && rm -rf "${name}")
          done
          (cd dist && sha256sum *.zip > checksums.txt)
          ls -lh dist

      - name: Sign the checksums
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: dist/checksums.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.zip dist/checksums.txt dist/checksums.txt.sigstore.json

  docker:
    name: Publish the container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # The one place the Docker Hub namespace is written down is IMAGE_NAMESPACE,
      # and it is not a secret — it is the word that appears in the README, the
      # compose file, the Makefile, the documentation and on the Docker Hub page
      # itself. Everything a reader is told to pull is `j000k3r/weatherglass`.
      #
      # Which is why this fails loudly rather than quietly: if the account that
      # pushes is called something else, the release would succeed, the image would
      # be published, and every instruction in the project would point at a
      # repository that does not exist. A red job is a much better way to find that
      # out than a user finding it out.
      - name: Check that the pushing account is the one the documentation names
        env:
          PUSHING: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ "$PUSHING" != "${{ env.IMAGE_NAMESPACE }}" ]; then
            echo "::error::The DOCKERHUB_USERNAME secret is '$PUSHING' but the project"
            echo "::error::documents its images as '${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}'."
            echo "::error::Either the secret is wrong, or every mention in README.md,"
            echo "::error::DOCKERHUB.md, docker-compose.yml, the Makefile and both sites"
            echo "::error::is wrong. Fix one of the two before publishing."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 produces 1.2.3, 1.2, 1 and latest. Pre-release tags such as
      # v1.2.3-rc.1 produce only themselves, so "latest" never points at one.
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keeps the Docker Hub description in step with the repository: the page a
      # user actually lands on is the one that has to be current, and a
      # description that drifts is worse than a short one.
      # Requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN, already used above.
      - name: Update the Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          short-description: "A small, self-hosted watchdog for your homelab."
          readme-filepath: ./DOCKERHUB.md

      - name: Summarise the published tags
        run: echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
