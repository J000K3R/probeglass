name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # to create the release
  packages: write   # to push to ghcr.io
  # `id-token: write` was here, for the keyless Sigstore signature on the
  # checksums of the release archives. Both are gone with the archives, and a
  # permission that nothing asks for is a permission worth not granting — the
  # workflow no longer requests an OIDC token at all.

env:
  GOTOOLCHAIN: local
  IMAGE_NAME: probeglass
  # The namespace every document in this project names, and the one the image is
  # published under. `make rename` rewrites the Go module path but deliberately
  # leaves the image name alone, so a fork that publishes under its own account has
  # to change this line, `IMAGE` in the Makefile, and the mentions in README.md,
  # docker-compose.yml and both sites.
  IMAGE_NAMESPACE: j000k3r

jobs:
  release:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the changelog is generated from the tag history

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The tag is `v0.1.0`; the version the image reports is `0.1.0`. Nothing but the
      # tag carries the `v`, so it is stripped once here rather than at each use.
      - name: Work out the version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The test suite decides whether the tag becomes a release.
      - name: Test
        # The same timeout the CI job uses: internal/api alone takes over seven
        # minutes under the race detector, and Go's default ten-minute per-package
        # limit is close enough that a slower release runner would trip it.
        run: go test ./... -count=1 -race -timeout=20m

      # The release body is the changelog — the whole of it, so that the tag page
      # carries the history with it. `--generate-notes` would say which commits landed
      # instead, which is a different question and one nobody outside this repository
      # can answer usefully.
      #
      # The script refuses to print anything for a version CHANGELOG.md has no section
      # for, so this step is also what stops a release being published with empty
      # notes. Rename `## [Unreleased]` to `## [x.y.z] - <date>` before tagging; the
      # failure message says so.
      - name: Write the release notes out of the changelog
        run: |
          set -euo pipefail
          {
            echo "**Container image:** \`ghcr.io/${IMAGE_NAMESPACE}/${IMAGE_NAME}:${{ steps.version.outputs.value }}\`"
            echo ""
            echo "Every change since the first release, in full. This is"
            echo "[CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)"
            echo "as it stands at this tag."
            echo ""
            echo "---"
            echo ""
            scripts/release-notes.sh "${{ steps.version.outputs.value }}"
          } > release-notes.md
          wc -l release-notes.md

      # No assets. Seven zip files used to be attached here — linux, darwin,
      # windows, freebsd — and they promised a way to run this that nothing
      # documented and that two things would not have survived: the docker sensor
      # speaks to the Engine over a unix socket, and `doctor` tells you to run it
      # with `docker exec`. The product is the container, and the container is
      # published by the `docker` job below.
      #
      # The checksums and their Sigstore signature went with the archives; there
      # is nothing left to check a download of. The image itself is unsigned.
      # A tag with a hyphen in it — `v0.3.0-rc.1`, `v0.3.0-beta.2` — is a candidate, and
      # GitHub is told so rather than left to guess. The image tags already know the
      # difference: `latest` is only moved by a tag without one, which is what stops a
      # candidate becoming the thing everybody pulls. Without --prerelease the release
      # page would still look like any other, and the only clue would be the name.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=""
          case "${GITHUB_REF_NAME}" in
            *-*) flags="--prerelease" ;;
          esac
          # Unquoted on purpose: it is either one flag or nothing at all, and quoting
          # it would pass an empty argument that gh reads as a title.
          # shellcheck disable=SC2086
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md $flags

  docker:
    name: Publish the container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The tag is `v0.1.0`; the version the image reports is `0.1.0`.
      - name: Work out the version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # One registry, and it is GitHub's own, so there is no account to
      # cross-check and no second set of credentials to keep alive. The image
      # goes to ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}, which
      # is the name every document in the project tells a reader to pull.
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v0.1.0 produces 0.1.0, 0.1 and latest. The moving major tag — a bare
      # "0" — is left out on purpose: before 1.0 it would promise every 0.x,
      # and a reader who pinned "0" would be pinned to nothing at all.
      # Pre-release tags such as v0.2.0-rc.1 produce only themselves, so
      # "latest" never points at one.
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            CHANNEL=release
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise the published tags
        run: echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
